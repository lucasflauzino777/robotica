<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contato - Robótica</title>
    <link rel="icon" type="image/jpg" href="img/iconrobo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #6c757d; /* Mantém o fundo cinza em 100% da tela */
        }

        .telacentro {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Mantém navbar no topo e footer no rodapé */
        }

        .centralizar {
            flex-grow: 1;
            display: flex;
            align-items: center; /* Centraliza verticalmente no espaço disponível */
            justify-content: center; /* Centraliza horizontalmente */
            padding: 20px 0;
        }

        .box {
            max-width: 450px;
            width: 90%;
            margin: 0 auto;
            padding: 16px;
            background-color: #121212;
            border-radius: 6px;
        }

        .campo {
            margin-bottom: 12px;
        }

        .campo label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
        }

        .obrigatorio {
            color: #ff4d4d;
            margin-left: 2px;
        }

        .legenda-obrigatorio {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 12px;
            display: block;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 6px 10px;
            font-size: 0.85rem;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .campo textarea {
            resize: none;
            height: 90px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .botoes button {
            padding: 6px 16px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="p-3 bg-secondary text-white telacentro">
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand">
                    ROBÓTICA
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">HOME</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre.html">SOBRE</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="bibliografia.html">BIBLIOGRAFIA</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="creditos.html">CRÉDITOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contatos.html">CONTATO</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                PORTUGUÊS
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="contacts.html">INGLÊS</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="centralizar">
            <div class="box">
                <form>
                    <span class="legenda-obrigatorio"><span class="obrigatorio">*</span> Campos de preenchimento obrigatório</span>

                    <div class="campo">
                        <label for="nome">Nome: <span class="obrigatorio">*</span></label>
                        <input type="text" id="nome" name="nome" pattern="[A-Za-zÀ-ÿ\s]+"
                            title="Apenas letras são permitidas" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail: <span class="obrigatorio">*</span></label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone: <span class="obrigatorio">*</span></label>
                        <input type="tel" id="telefone" name="telefone" pattern="[\d\s()+-]+"
                            title="Digite um telefone válido" required>
                    </div>

                    <div class="campo">
                        <label for="avaliacao">Avalie nosso site: <span class="obrigatorio">*</span></label>
                        <select id="avaliacao" name="avaliacao" required>
                            <option value="" disabled selected>Selecione uma nota</option>
                            <option value="0">0 - Muito Ruim</option>
                            <option value="1">1 - Ruim</option>
                            <option value="2">2 - Regular</option>
                            <option value="3">3 - Bom</option>
                            <option value="4">4 - Muito Bom</option>
                            <option value="5">5 - Excelente</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="comentario">Comentário:</label>
                        <textarea id="comentario" name="comentario" rows="4"></textarea>
                    </div>

                    <div class="botoes">
                        <button type="submit" class="btn btn-dark">Enviar</button>
                        <button type="reset" class="btn btn-secondary">Limpar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card text-bg-dark border-light mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
                <p class="card-text m-0 text-center flex-grow-1">
                    Etec de Hortolândia 2026 &copy; Todos os direitos reservados<br>Trabalho acadêmico sem fins lucrativos.
                </p>
                <a href="#" class="btn btn-primary btn-sm">TOPO</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
